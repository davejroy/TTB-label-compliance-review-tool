---
- name: Refresh apt metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install build and diagnostic packages
  ansible.builtin.apt:
    name: "{{ build_packages }}"
    state: present

- name: Create NodeSource keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource-repo.gpg.key
    mode: "0644"

- name: Install NodeSource signing key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /etc/apt/keyrings/nodesource.gpg /tmp/nodesource-repo.gpg.key
  args:
    creates: /etc/apt/keyrings/nodesource.gpg

- name: Configure NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main"
    filename: nodesource
    state: present

- name: Refresh apt metadata after adding NodeSource
  ansible.builtin.apt:
    update_cache: true

- name: Install supported Node.js runtime
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Install UFW when explicitly enabled
  ansible.builtin.apt:
    name: ufw
    state: present
  when: enable_ufw | bool

- name: Create the deployment group
  ansible.builtin.group:
    name: "{{ build_user }}"
    state: present

- name: Create a non-root deployment user
  ansible.builtin.user:
    name: "{{ build_user }}"
    group: "{{ build_user }}"
    create_home: true
    shell: /usr/sbin/nologin
    state: present

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ build_user }}"
    group: "{{ build_user }}"
    mode: "0750"
  loop:
    - "{{ application_root }}"
    - "{{ application_root }}/releases"
    - "{{ application_root }}/shared"

- name: Allow SSH through UFW when explicitly enabled
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ ssh_allowed_cidr }}"
  when: enable_ufw | bool

- name: Enable UFW only when explicitly enabled
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: enable_ufw | bool
