---
- name: Configure a TTB build and operations host
  hosts: build_hosts
  become: true
  gather_facts: true

  vars:
    build_user: ttbdeploy
    application_root: /opt/ttb-label-compliance
    enable_ufw: false
    ssh_allowed_cidr: ""
    node_major_version: "22"

    build_packages:
      - ca-certificates
      - curl
      - gnupg
      - git
      - jq
      - build-essential
      - python3
      - python3-venv
      - python3-pip

  pre_tasks:
    - name: Require a Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "This playbook currently supports Debian-family hosts. Override the package role for other distributions."

    - name: Require an explicit SSH source range when firewall enablement is requested
      ansible.builtin.assert:
        that:
          - ssh_allowed_cidr | length > 0
        fail_msg: "Set ssh_allowed_cidr to a trusted CIDR before setting enable_ufw=true."
      when: enable_ufw | bool

  roles:
    - role: build_host
