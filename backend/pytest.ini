[pytest]
# Backend test configuration for the TTB Label Compliance Review Tool.
# CI runs `pytest tests/` from the backend/ directory (see
# .github/workflows/test.yml). Keeping config here lets contributors run the
# suite the same way locally, from the backend/ directory.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --color=yes
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: end-to-end tests that call the live Anthropic API (skipped unless ANTHROPIC_API_KEY is set)
