name: IaC validation

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate

  ansible:
    name: Ansible syntax validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core
      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Check playbook syntax
        run: ansible-playbook --syntax-check -i inventory/hosts.example.yml playbooks/site.yml
