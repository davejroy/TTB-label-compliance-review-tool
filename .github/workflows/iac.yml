name: IaC validation

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    name: Terraform format and validation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate

  ansible:
    name: Ansible syntax validation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core
      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Check playbook syntax
        run: ansible-playbook --syntax-check -i inventory/hosts.example.yml playbooks/site.yml
