# .github/workflows/test.yml
#
# Runs the backend pytest suite and frontend vitest suite
# on pull requests to main (opened/synchronize/ready_for_review) and manual dispatch. Flag-only.
# Also validates that the backend Docker image builds cleanly without secrets.
# No Anthropic API key is needed: the tests exercise compliance matching
# and confidence-gate logic only (no live API calls).

name: Test & Build CI

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_regression:
        description: "Run the 59-image live regression suite (requires TTB_REGRESSION_BASE_URL)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Backend Tests (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install libheif for HEIC/HEIF decode
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif1 libde265-0

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --color=yes
        env:
          PYTHONPATH: .

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: backend/.pytest_cache/
          retention-days: 7

  frontend-tests:
    name: Frontend Tests & Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm test

      - name: Test production bundle build
        run: npm run build

  docker-build:
    name: Docker Build Matrix (Secret-Free)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            dockerfile: backend/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker Image (${{ matrix.service.name }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ttb-${{ matrix.service.name }}:test

  # --------------------------------------------------------------------
  # Optional end-to-end job: only runs when an ANTHROPIC_API_KEY secret is
  # configured on the repo.
  # --------------------------------------------------------------------
  e2e:
    name: end-to-end (live API, optional)
    runs-on: ubuntu-latest
    needs: pytest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install libheif for HEIC/HEIF decode
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif1 libde265-0

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run end-to-end tests (only if API key secret is present)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set - skipping live end-to-end tests."
            exit 0
          fi
          PYTHONPATH=. pytest tests/ -v -m e2e --tb=short --color=yes

  # --------------------------------------------------------------------
  # Optional live regression: 59-image suite against a deployed API.
  # Set repository variable/secret TTB_REGRESSION_BASE_URL. Never hardcode
  # a host. Token is optional (TTB_REGRESSION_TOKEN) and is not logged.
  # --------------------------------------------------------------------
  regression:
    name: Live label regression (opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_regression
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runner dependencies
        run: pip install requests

      - name: Run regression suite
        env:
          TTB_REGRESSION_BASE_URL: ${{ secrets.TTB_REGRESSION_BASE_URL || vars.TTB_REGRESSION_BASE_URL }}
          TTB_REGRESSION_TOKEN: ${{ secrets.TTB_REGRESSION_TOKEN }}
        run: |
          if [ -z "$TTB_REGRESSION_BASE_URL" ]; then
            echo "TTB_REGRESSION_BASE_URL is not set. Add it as a repository variable or secret, then re-run."
            exit 1
          fi
          python3 tests/regression/run_regression.py
          python3 tests/regression/score_results.py
